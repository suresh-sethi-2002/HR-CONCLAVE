<aside class="notice" aria-label="Notice and updates">
  <section class="notice-panel" id="notice-panel" aria-labelledby="notice-title" hidden>
    <div class="notice-panel-heading">
      <h2 id="notice-title">Notices &amp; updates</h2>
      <button type="button" class="notice-minimize">Minimize <span aria-hidden="true">−</span></button>
    </div>
    <p class="notice-status" role="status"></p>
    <ul class="notice-list"></ul>
  </section>
  <div class="notice-bar">
    <button type="button" class="notice-toggle" aria-expanded="false" aria-controls="notice-panel" aria-label="Notices and updates" aria-describedby="notice-preview">
      <span class="notice-icon" aria-hidden="true">!</span>
      <span class="notice-label">Notice &amp; updates</span>
      <span class="notice-preview" id="notice-preview"><span>Loading updates…</span></span>
      <span class="notice-chevron" aria-hidden="true"></span>
    </button>
    <button type="button" class="notice-playback" aria-label="Pause notice rotation" hidden><span aria-hidden="true">❚❚</span></button>
  </div>
</aside>
